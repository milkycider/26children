<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Quicksand:wght@500;700&display=swap">
<title>ロアドの児従録 - テストプレイ班 探索者ポータル</title>
<!-- 検索避け: 検索エンジンに載せない・キャッシュさせない(身内向けサイトのため) -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="クトゥルフ神話TRPG「ロアドの児従録」テストプレイ班の探索者ポータル(非公式・身内向け)">
<!-- リンクを貼ったときのプレビュー(Discord・Xなど) -->
<meta property="og:type" content="website">
<meta property="og:title" content="ロアドの児従録 - テストプレイ班 探索者ポータル">
<meta property="og:description" content="テストプレイ班の探索者一覧・データ一覧・掲示板">
<meta name="twitter:card" content="summary">
<!-- ▼ ファビコン・プレビュー画像を用意したら、この行と「▲ ここまで」の行を消して、間の3行を有効にする(ファイルはこのHTMLと同じ場所に置く)
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta property="og:image" content="https://(サイトのURL)/ogp.png">
▲ ここまで -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <div class="ttl">
    <h1>ロアドの児従録</h1>
    <div class="yomi">-ろあどのにじゅうろく-</div>
    <div class="sub">テストプレイ班　探索者ポータル</div>
  </div>
  <div class="hright">
    <div class="hbtns">
      <div class="login" id="login" hidden></div>
      <button class="newsbtn" id="newsbtn" aria-haspopup="dialog">お知らせ<span class="rbadge" id="nbadge" hidden></span></button>
    </div>
    <div class="lhelp" id="lhelp" role="dialog" aria-label="ログインについて" hidden>
    </div>
    <div class="count"><b id="count">0</b>/<span id="total">0</span> 名表示中</div>
  </div>
</header>

<nav class="tabs" aria-label="ページ切り替え">
  <button data-p="chars" aria-selected="true">キャラクター</button>
  <button data-p="skills" aria-selected="false">データ一覧</button>
  <button data-p="height" aria-selected="false">身長くらべ</button>
  <button data-p="board" aria-selected="false">掲示板</button>
  <button data-p="reports" aria-selected="false">不具合報告<span class="rbadge" id="rbadge" hidden></span></button>
</nav>

<div class="controls">
  <div class="inner">
    <div class="search"><input id="q" type="search" placeholder="PC名・PL名・読み・HO名・特徴・技能備考などで検索" aria-label="検索"></div>
    <div class="group only-chars"><span class="lbl">並び替え</span>
      <select id="sort" aria-label="並び替え">
        <option value="ho">HO順</option>
        <option value="ageA">年齢が低い順</option>
        <option value="ageD">年齢が高い順</option>
        <option value="hA">身長が低い順</option>
        <option value="hD">身長が高い順</option>
      </select>
    </div>
    <div class="group only-chars" id="g-view">
      <button class="chip" data-v="card" aria-pressed="true">カード</button>
      <button class="chip" data-v="table" aria-pressed="false">一覧表</button>
    </div>
    <div class="group only-chars only-card"><span class="lbl">列数</span>
      <select id="cols" aria-label="カードの列数">
        <option value="auto">自動</option>
        <option value="2">2列</option><option value="3">3列</option><option value="4">4列</option><option value="5">5列</option><option value="6">6列</option>
      </select>
    </div>
    <div class="spacer"></div>
    <button class="chip" id="ftoggle" aria-expanded="false" aria-controls="fpanel">絞り込み ▾</button>
    <button class="chip" id="reset">リセット</button>
  </div>
  <div class="panel" id="fpanel" hidden>
    <div class="inner">
      <div class="group" id="g-sex"><span class="lbl">性別</span></div>
      <div class="group" id="g-cat"><span class="lbl">能力</span></div>
      <div class="group only-chars" id="g-range"><span class="lbl">射程</span></div>
      <div class="group only-chars"><span class="lbl">特徴表</span><select id="trait" aria-label="特徴表"></select></div>
    </div>
  </div>
</div>

<main id="main"></main>
<p class="pagehint">カードや行をクリックで詳細(←/→キーで前後、Escで閉じる) / データ一覧は見出しクリックで並び替え / 技能の薄いグレーは初期値</p>
<footer class="sitefoot" id="sitefoot"></footer>

<div class="overlay" id="info-ov" role="dialog" aria-modal="true" aria-labelledby="info-title">
  <div class="modal newsmodal infomodal">
    <button class="btn close" id="info-close">✕</button>
    <div class="mscroll" id="info-body"></div>
  </div>
</div>

<div class="overlay" id="news-ov" role="dialog" aria-modal="true" aria-labelledby="news-title">
  <div class="modal newsmodal">
    <button class="btn close" id="news-close">✕</button>
    <div class="mscroll"><h2 id="news-title">お知らせ・更新履歴</h2><div id="news-list"></div><div style="height:22px"></div></div>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="modal" id="modal"></div>
</div>

<!-- Firebaseの設定と管理者IDは、同じ場所に置いた firebase-config.js に書く(無ければDB未接続で動く) -->

<!-- 設定(firebase-config.js) → データ → 文章 → 動作 の順に読み込む -->
<script src="firebase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
